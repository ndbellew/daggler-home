name: grafana
display_name: Grafana
suite: utilities

description: Dashboards and visualization for Daggler metrics and monitoring data

provides:
  - dashboards
  - metrics-visualization
  - monitoring-ui

dependencies:
  metrics-source:
    required: false
    default: prometheus

resources:
  cpu_cores_min: 1
  memory_mb_min: 256

deployment:
  compose_service: grafana

ports:
  - port: 3000
    protocol: tcp
    internal: true

storage:
  - source: /var/lib/daggler-home/grafana
    target: /var/lib/grafana

web:
  enabled: true
  hostname: grafana
  protocol: http
  port: 3000
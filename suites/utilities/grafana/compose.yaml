services:
  grafana:
    image: grafana/grafana:13.2.1
    container_name: daggler-grafana
    hostname: grafana
    restart: unless-stopped

    environment:
      TZ: "${TZ}"

    volumes:
      - /var/lib/daggler-home/grafana:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro

    ports:
      - "${DAGGLER_LAN_IP}:3000:3000"

    networks:
      - daggler
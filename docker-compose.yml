name: daggler-home

services:
  unbound:
    build:
      context: ./services/unbound
    image: daggler-home/unbound:local
    container_name: daggler-unbound
    restart: unless-stopped
    networks:
      dns:
        aliases:
          - unbound

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: daggler-pihole
    hostname: pihole
    restart: unless-stopped

    depends_on:
      - unbound

    ports:
      - "${DAGGLER_LAN_IP}:53:53/tcp"
      - "${DAGGLER_LAN_IP}:53:53/udp"
      - "${DAGGLER_LAN_IP}:8080:80/tcp"

    environment:
      TZ: "${TZ}"
      WEBPASSWORD_FILE: pihole_admin_password
      FTLCONF_dns_upstreams: "unbound#5335"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_dnssec: "false"

    secrets:
      - pihole_admin_password

    volumes:
      - /var/lib/daggler-home/pihole:/etc/pihole

    networks:
      - dns

secrets:
  pihole_admin_password:
    file: /etc/daggler-home/secrets/pihole_admin_password

networks:
  dns:
    name: daggler-dns
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.53.0/24
name: daggler-home

services:
  portainer:
    image: portainer/portainer-ce:2.45.0
    container_name: daggler-portainer
    restart: unless-stopped

    ports:
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:9443:9443/tcp"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/daggler-home/portainer:/data


  prometheus:
    image: prom/prometheus:latest
    container_name: daggler-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./services/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: daggler-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: daggler-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP must be set}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    secrets:
      - grafana_admin_password
    restart: unless-stopped

secrets:
  pihole_admin_password:
    file: /etc/daggler-home/secrets/pihole_admin_password

  grafana_admin_password:
    file: /etc/daggler-home/secrets/grafana_admin_password


networks:
  dns:
    name: daggler-dns
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.53.0/24

  monitoring:
    name: daggler-monitoring
    driver: bridge



volumes:
  prometheus_data:
    name: daggler-prometheus-data

  grafana_data:
    name: daggler-grafana-data




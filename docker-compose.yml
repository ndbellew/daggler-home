name: daggler-home

services:
  portainer:
    image: portainer/portainer-ce:2.45.0
    container_name: daggler-portainer
    restart: unless-stopped

    ports:
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:9443:9443/tcp"

    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/daggler-home/portainer:/data

  unbound:
    build:
      context: ./services/unbound
    image: daggler-home/unbound:local
    container_name: daggler-unbound
    restart: unless-stopped
    networks:
      dns:
        aliases:
          - unbound

  caddy:
    image: caddy:2
    container_name: daggler-caddy
    restart: unless-stopped
    environment:
      DAGGLER_DOMAIN: "${DAGGLER_DOMAIN:-daggler.home.arpa}"

    ports:
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:80:80"
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:443:443"

    volumes:
      - ./services/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - /var/lib/daggler-home/caddy/data:/data
      - /var/lib/daggler-home/caddy/config:/config

    networks:
      - default
      - dns
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: daggler-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yaml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./services/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: daggler-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: daggler-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP must be set}:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./services/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    secrets:
      - grafana_admin_password
    restart: unless-stopped

  pihole:
    image: pihole/pihole:2026.07.2
    container_name: daggler-pihole
    hostname: pihole
    restart: unless-stopped

    depends_on:
      - unbound

    ports:
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:53:53/tcp"
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:53:53/udp"
      - "${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set}:8080:80/tcp"

    environment:
      TZ: "${TZ}"
      WEBPASSWORD_FILE: pihole_admin_password
      FTLCONF_dns_upstreams: "unbound#5335"
      FTLCONF_dns_listeningMode: "ALL"
      FTLCONF_dns_dnssec: "false"
      FTLCONF_dns_hosts: |-
        ${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set} portainer.${DAGGLER_DOMAIN:-daggler.home.arpa}
        ${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set} grafana.${DAGGLER_DOMAIN:-daggler.home.arpa}
        ${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set} prometheus.${DAGGLER_DOMAIN:-daggler.home.arpa}
        ${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set} pihole.${DAGGLER_DOMAIN:-daggler.home.arpa}
        ${DAGGLER_LAN_IP:?DAGGLER_LAN_IP_must_be_set} odysseus.${DAGGLER_DOMAIN:-daggler.home.arpa}

    secrets:
      - pihole_admin_password

    volumes:
      - /var/lib/daggler-home/pihole:/etc/pihole

    networks:
      - dns

secrets:
  pihole_admin_password:
    file: /etc/daggler-home/secrets/pihole_admin_password

  grafana_admin_password:
    file: /etc/daggler-home/secrets/grafana_admin_password


networks:
  dns:
    name: daggler-dns
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.53.0/24

  monitoring:
    name: daggler-monitoring
    driver: bridge



volumes:
  prometheus_data:
    name: daggler-prometheus-data

  grafana_data:
    name: daggler-grafana-data




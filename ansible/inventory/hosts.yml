# Inventory file for Daggler Home

# Core servers
[core_servers]
localhost ansible_connection=local
# Add your core servers here
# example:
# server1 ansible_host=192.168.1.10 ansible_user=ubuntu purpose=core_servers monitoring=active

# Docker hosts
[docker_hosts]
# Add your Docker hosts here
# example:
# docker1 ansible_host=192.168.1.20 ansible_user=ubuntu purpose=docker_hosts monitoring=active

# AI hosts
[ai_hosts]
# Add your AI hosts here
# example:
# ai1 ansible_host=192.168.1.30 ansible_user=ubuntu purpose=ai_hosts monitoring=active

# Workstations
[workstations]
# Add your workstations here
# example:
# workstation1 ansible_host=192.168.1.40 ansible_user=ubuntu purpose=workstations monitoring=active

# Monitored systems
[monitored]
# Add systems to be monitored
# example:
# monitor1 ansible_host=192.168.1.50 ansible_user=ubuntu purpose=monitored monitoring=active

# Daggler-specific hosts
[daggler]
# Add Daggler-specific hosts
# example:
# daggler1 ansible_host=192.168.1.60 ansible_user=ubuntu purpose=daggler monitoring=active

# Variables for all groups
[all:vars]
ansible_python_interpreter=/usr/bin/python3
monitoring_enabled = true

# Variables for core_servers
[core_servers:vars]
purpose = core_servers
monitoring = active

# Variables for docker_hosts
[docker_hosts:vars]
purpose = docker_hosts
monitoring = active

# Variables for ai_hosts
[ai_hosts:vars]
purpose = ai_hosts
monitoring = active

# Variables for workstations
[workstations:vars]
purpose = workstations
monitoring = active

# Variables for monitored
[monitored:vars]
purpose = monitored
monitoring = active

# Variables for daggler
[daggler:vars]
purpose = daggler
monitoring = active


all:
  hosts:
    localhost:
      ansible_host: 127.0.0.1
      ansible_user: your_username
      ansible_ssh_private_key_file: ~/.ssh/id_rsa
    server1:
      ansible_host: 192.168.1.100
      ansible_user: your_username
      ansible_ssh_private_key_file: ~/.ssh/id_rsa